<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1e2e">
  <title>Tetris — Juegos</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #1e1e2e; color: #eee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
    h1 { margin: 0 0 6px; }
    p { color: #aaa; text-align: center; }
    .juego { display: flex; align-items: flex-start; gap: 20px; margin: 16px 0; }
    canvas { display: block; background: #11111b; border: 2px solid #494966; border-radius: 6px; }
    #tablero { width: min(60vw, 300px); height: auto; aspect-ratio: 1 / 2; }
    aside { min-width: 100px; }
    .dato { margin: 0 0 14px; color: #aaa; }
    .dato strong { display: block; color: #eee; font-size: 1.35rem; margin-top: 3px; }
    #siguiente { width: 100px; height: 100px; }
    .acciones, .teclas { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button { border: 1px solid #565674; border-radius: 7px; background: #30304a; color: #eee; padding: 10px 14px; font-size: 1rem; cursor: pointer; touch-action: manipulation; }
    button:hover { border-color: #9aaeff; }
    button:focus-visible, a:focus-visible { outline: 3px solid #9aaeff; outline-offset: 2px; }
    #estado { min-height: 1.4em; }
    .teclas { max-width: 360px; margin-top: 12px; }
    .volver { margin-top: 18px; } a { color: #9aaeff; }
    @media (max-width: 480px) { .juego { gap: 12px; } #tablero { width: min(68vw, 270px); } button { padding: 9px 11px; } }
  </style>
</head>
<body>
  <h1>Tetris</h1>
  <p>Completa líneas horizontales para despejar el tablero y sumar puntos.</p>
  <div class="juego">
    <canvas id="tablero" width="300" height="600" aria-label="Tablero de Tetris"></canvas>
    <aside aria-label="Marcadores">
      <p class="dato">Puntuación<strong id="puntuacion">0</strong></p>
      <p class="dato">Líneas<strong id="lineas">0</strong></p>
      <p class="dato">Nivel<strong id="nivel">1</strong></p>
      <p class="dato">Siguiente pieza</p>
      <canvas id="siguiente" width="100" height="100" aria-label="Siguiente pieza"></canvas>
    </aside>
  </div>
  <p id="estado" role="status" aria-live="polite">Pulsa Iniciar o una tecla de movimiento.</p>
  <div class="acciones">
    <button id="iniciar" type="button">Iniciar / continuar</button>
    <button id="pausar" type="button">Pausar</button>
    <button id="reiniciar" type="button">Nueva partida</button>
  </div>
  <div class="teclas" aria-label="Controles táctiles">
    <button data-accion="izquierda" type="button" aria-label="Mover a la izquierda">←</button>
    <button data-accion="girar" type="button">Girar ↻</button>
    <button data-accion="derecha" type="button" aria-label="Mover a la derecha">→</button>
    <button data-accion="bajar" type="button" aria-label="Bajar pieza">↓</button>
    <button data-accion="caer" type="button">Caída rápida</button>
  </div>
  <p>Teclado: ← → mover · ↓ bajar · ↑ girar · Espacio caída rápida · P pausar</p>
  <p class="volver"><a href="../">← Volver al índice de juegos</a></p>
  <script>
    (() => {
      const canvas = document.getElementById('tablero');
      const ctx = canvas.getContext('2d');
      const preview = document.getElementById('siguiente').getContext('2d');
      const columnas = 10, filas = 20, tam = 30;
      const formas = [
        { color: '#38bdf8', celdas: [[1, 0], [1, 1], [1, 2], [1, 3]] },
        { color: '#facc15', celdas: [[0, 0], [1, 0], [0, 1], [1, 1]] },
        { color: '#a78bfa', celdas: [[1, 0], [0, 1], [1, 1], [2, 1]] },
        { color: '#4ade80', celdas: [[1, 0], [2, 0], [0, 1], [1, 1]] },
        { color: '#fb7185', celdas: [[0, 0], [1, 0], [1, 1], [2, 1]] },
        { color: '#60a5fa', celdas: [[0, 0], [0, 1], [1, 1], [2, 1]] },
        { color: '#fb923c', celdas: [[2, 0], [0, 1], [1, 1], [2, 1]] }
      ];
      let tablero, pieza, siguiente, jugando = false, terminado = false;
      let puntos = 0, lineas = 0, ultimo = 0, acumulado = 0;
      const estado = document.getElementById('estado');
      const clonar = (forma) => ({ color: forma.color, celdas: forma.celdas.map(([x, y]) => [x, y]) });
      const crearPieza = () => {
        const forma = clonar(formas[Math.floor(Math.random() * formas.length)]);
        return { ...forma, x: Math.floor((columnas - 3) / 2), y: 0 };
      };
      function dibujarCelda(contexto, x, y, color, size) {
        contexto.fillStyle = color;
        contexto.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
        contexto.strokeStyle = 'rgba(255,255,255,.2)';
        contexto.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
      }
      function dibujar() {
        ctx.fillStyle = '#11111b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < filas; y++) for (let x = 0; x < columnas; x++) {
          if (tablero[y][x]) dibujarCelda(ctx, x, y, tablero[y][x], tam);
          else { ctx.strokeStyle = '#29293a'; ctx.strokeRect(x * tam, y * tam, tam, tam); }
        }
        if (pieza) for (const [dx, dy] of pieza.celdas) dibujarCelda(ctx, pieza.x + dx, pieza.y + dy, pieza.color, tam);
        preview.fillStyle = '#11111b';
        preview.fillRect(0, 0, 100, 100);
        const minX = Math.min(...siguiente.celdas.map(([x]) => x));
        const maxX = Math.max(...siguiente.celdas.map(([x]) => x));
        const minY = Math.min(...siguiente.celdas.map(([, y]) => y));
        const maxY = Math.max(...siguiente.celdas.map(([, y]) => y));
        const offsetX = Math.floor((100 - (maxX - minX + 1) * 20) / 2);
        const offsetY = Math.floor((100 - (maxY - minY + 1) * 20) / 2);
        for (const [x, y] of siguiente.celdas) dibujarCelda(preview, x - minX + offsetX / 20, y - minY + offsetY / 20, siguiente.color, 20);
      }
      function actualizarMarcadores() {
        document.getElementById('puntuacion').textContent = puntos;
        document.getElementById('lineas').textContent = lineas;
        document.getElementById('nivel').textContent = Math.floor(lineas / 10) + 1;
      }
      function colision(candidata) {
        return candidata.celdas.some(([dx, dy]) => {
          const x = candidata.x + dx, y = candidata.y + dy;
          return x < 0 || x >= columnas || y >= filas || (y >= 0 && tablero[y][x]);
        });
      }
      function fijar() {
        for (const [dx, dy] of pieza.celdas) {
          const y = pieza.y + dy;
          if (y < 0) { terminar(); return; }
          tablero[y][pieza.x + dx] = pieza.color;
        }
        limpiarLineas();
        pieza = siguiente;
        siguiente = crearPieza();
        if (colision(pieza)) terminar();
        dibujar();
      }
      function limpiarLineas() {
        let borradas = 0;
        for (let y = filas - 1; y >= 0; y--) {
          if (tablero[y].every(Boolean)) {
            tablero.splice(y, 1);
            tablero.unshift(Array(columnas).fill(null));
            borradas++;
            y++;
          }
        }
        if (borradas) {
          lineas += borradas;
          puntos += [0, 100, 300, 500, 800][borradas] * (Math.floor(lineas / 10) + 1);
          actualizarMarcadores();
        }
      }
      function girar() {
        const girada = clonar(pieza);
        const maxY = Math.max(...girada.celdas.map(([, y]) => y));
        girada.celdas = girada.celdas.map(([x, y]) => [maxY - y, x]);
        const minX = Math.min(...girada.celdas.map(([x]) => x));
        const minY = Math.min(...girada.celdas.map(([, y]) => y));
        girada.celdas = girada.celdas.map(([x, y]) => [x - minX, y - minY]);
        const ancho = Math.max(...girada.celdas.map(([x]) => x)) + 1;
        girada.x = Math.min(girada.x, columnas - ancho);
        if (!colision(girada)) { pieza = girada; dibujar(); }
      }
      function bajar(sumaPunto = false) {
        const candidata = { ...pieza, y: pieza.y + 1 };
        if (colision(candidata)) fijar();
        else { pieza = candidata; if (sumaPunto) { puntos++; actualizarMarcadores(); } dibujar(); }
      }
      function soltar() {
        while (!colision({ ...pieza, y: pieza.y + 1 })) { pieza.y++; puntos += 2; }
        actualizarMarcadores();
        fijar();
      }
      function terminar() {
        jugando = false;
        terminado = true;
        estado.textContent = `Partida terminada. Puntuación: ${puntos}. Pulsa Nueva partida para volver a jugar.`;
      }
      function bucle(tiempo = 0) {
        const delta = Math.min(tiempo - ultimo, 100);
        ultimo = tiempo;
        if (jugando) {
          acumulado += delta;
          const intervalo = Math.max(100, 800 - (Math.floor(lineas / 10) * 70));
          if (acumulado >= intervalo) { bajar(); acumulado = 0; }
        }
        requestAnimationFrame(bucle);
      }
      function iniciar() {
        if (terminado) return;
        jugando = true;
        estado.textContent = 'En juego.';
      }
      function reiniciar() {
        tablero = Array.from({ length: filas }, () => Array(columnas).fill(null));
        puntos = 0; lineas = 0; terminado = false; acumulado = 0;
        pieza = crearPieza(); siguiente = crearPieza();
        actualizarMarcadores(); dibujar();
        iniciar();
      }
      function accion(nombre) {
        if (!jugando || terminado) return;
        if (nombre === 'izquierda' || nombre === 'derecha') {
          const candidata = { ...pieza, x: pieza.x + (nombre === 'izquierda' ? -1 : 1) };
          if (!colision(candidata)) { pieza = candidata; dibujar(); }
        } else if (nombre === 'bajar') bajar(true);
        else if (nombre === 'girar') girar();
        else if (nombre === 'caer') soltar();
      }
      document.getElementById('iniciar').addEventListener('click', iniciar);
      document.getElementById('pausar').addEventListener('click', () => {
        jugando = false;
        if (!terminado) estado.textContent = 'Partida en pausa.';
      });
      document.getElementById('reiniciar').addEventListener('click', reiniciar);
      document.querySelectorAll('[data-accion]').forEach((boton) =>
        boton.addEventListener('click', () => accion(boton.dataset.accion)));
      document.addEventListener('keydown', (evento) => {
        const acciones = { ArrowLeft: 'izquierda', ArrowRight: 'derecha', ArrowDown: 'bajar', ArrowUp: 'girar', ' ': 'caer' };
        if (evento.key.toLowerCase() === 'p') {
          if (jugando) document.getElementById('pausar').click();
          else iniciar();
          return;
        }
        if (acciones[evento.key]) { evento.preventDefault(); accion(acciones[evento.key]); }
      });
      reiniciar();
      jugando = false;
      estado.textContent = 'Pulsa Iniciar o una tecla de movimiento.';
      requestAnimationFrame(bucle);
    })();
  </script>
</body>
</html>
