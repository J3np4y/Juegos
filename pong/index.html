<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1e2e">
  <title>Pong — Juegos</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #1e1e2e; color: #eee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; }
    h1 { margin: 0 0 6px; }
    p { color: #aaa; text-align: center; }
    .marcador { display: flex; justify-content: center; gap: 42px; margin: 10px 0; }
    .marcador span { color: #aaa; text-align: center; }
    .marcador strong { display: block; color: #eee; font-size: 1.8rem; }
    canvas { width: min(94vw, 800px); height: auto; aspect-ratio: 16 / 9; background: #11111b; border: 2px solid #494966; border-radius: 8px; }
    .acciones, .movimiento { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    button { border: 1px solid #565674; border-radius: 7px; background: #30304a; color: #eee; padding: 10px 14px; font-size: 1rem; cursor: pointer; touch-action: none; user-select: none; }
    button:hover { border-color: #9aaeff; }
    button:focus-visible, a:focus-visible { outline: 3px solid #9aaeff; outline-offset: 2px; }
    #estado { min-height: 1.4em; }
    .movimiento { max-width: 700px; justify-content: space-between; width: 100%; }
    .grupo { display: flex; gap: 6px; align-items: center; color: #aaa; }
    .volver { margin-top: 16px; } a { color: #9aaeff; }
  </style>
</head>
<body>
  <h1>Pong</h1>
  <p>Dos jugadores, dos paletas: devuelve la pelota y llega primero a 7 puntos.</p>
  <div class="marcador" aria-label="Marcador">
    <span>Jugador 1<strong id="puntos1">0</strong></span>
    <span>Jugador 2<strong id="puntos2">0</strong></span>
  </div>
  <canvas id="cancha" width="800" height="450" aria-label="Cancha de Pong para dos jugadores"></canvas>
  <p id="estado" role="status" aria-live="polite">Pulsa Iniciar para comenzar el partido.</p>
  <div class="acciones">
    <button id="iniciar" type="button">Iniciar / continuar</button>
    <button id="pausar" type="button">Pausar</button>
    <button id="reiniciar" type="button">Nuevo partido</button>
  </div>
  <div class="movimiento" aria-label="Controles táctiles">
    <div class="grupo">Jugador 1
      <button data-control="w" type="button" aria-label="Jugador 1 arriba">↑</button>
      <button data-control="s" type="button" aria-label="Jugador 1 abajo">↓</button>
    </div>
    <div class="grupo">Jugador 2
      <button data-control="up" type="button" aria-label="Jugador 2 arriba">↑</button>
      <button data-control="down" type="button" aria-label="Jugador 2 abajo">↓</button>
    </div>
  </div>
  <p>Teclado: W / S para el jugador 1 · ↑ / ↓ para el jugador 2 · P para pausar.</p>
  <p class="volver"><a href="../">← Volver al índice de juegos</a></p>
  <script>
    (() => {
      const canvas = document.getElementById('cancha');
      const ctx = canvas.getContext('2d');
      const ancho = canvas.width, alto = canvas.height;
      const paletaAncho = 12, paletaAlto = 82, radio = 8, limite = 7;
      const teclas = new Set(), controles = new Set();
      const jugadores = [
        { x: 24, y: (alto - paletaAlto) / 2, puntos: 0, arriba: 'w', abajo: 's' },
        { x: ancho - 36, y: (alto - paletaAlto) / 2, puntos: 0, arriba: 'up', abajo: 'down' }
      ];
      let pelota = { x: ancho / 2, y: alto / 2, vx: 0, vy: 0 };
      let jugando = false, terminado = false, espera = 0, ultimo = 0;
      const estado = document.getElementById('estado');
      function dibujar() {
        ctx.fillStyle = '#11111b'; ctx.fillRect(0, 0, ancho, alto);
        ctx.strokeStyle = '#41415a'; ctx.setLineDash([10, 12]); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(ancho / 2, 0); ctx.lineTo(ancho / 2, alto); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#a3e635';
        for (const jugador of jugadores) ctx.fillRect(jugador.x, jugador.y, paletaAncho, paletaAlto);
        ctx.beginPath(); ctx.arc(pelota.x, pelota.y, radio, 0, Math.PI * 2); ctx.fill();
      }
      function actualizarMarcador() {
        document.getElementById('puntos1').textContent = jugadores[0].puntos;
        document.getElementById('puntos2').textContent = jugadores[1].puntos;
      }
      function sacar(direccion) {
        pelota.x = ancho / 2; pelota.y = alto / 2;
        pelota.vx = 340 * direccion;
        pelota.vy = (Math.random() * 2 - 1) * 210;
        espera = .7;
      }
      function punto(jugador) {
        jugador.puntos++;
        actualizarMarcador();
        if (jugador.puntos >= limite) {
          jugando = false; terminado = true;
          estado.textContent = `¡Gana el jugador ${jugador === jugadores[0] ? 1 : 2}! Pulsa Nuevo partido para jugar otra vez.`;
        } else {
          estado.textContent = `Punto para el jugador ${jugador === jugadores[0] ? 1 : 2}.`;
          sacar(jugador === jugadores[0] ? 1 : -1);
        }
      }
      function actualizar(delta) {
        for (const jugador of jugadores) {
          const velocidad = 380 * delta;
          if (teclas.has(jugador.arriba) || controles.has(jugador.arriba)) jugador.y -= velocidad;
          if (teclas.has(jugador.abajo) || controles.has(jugador.abajo)) jugador.y += velocidad;
          jugador.y = Math.max(0, Math.min(alto - paletaAlto, jugador.y));
        }
        if (espera > 0) { espera -= delta; return; }
        pelota.x += pelota.vx * delta;
        pelota.y += pelota.vy * delta;
        if (pelota.y - radio <= 0 || pelota.y + radio >= alto) pelota.vy *= -1;
        for (const jugador of jugadores) {
          const toca = pelota.y + radio >= jugador.y && pelota.y - radio <= jugador.y + paletaAlto;
          const cruza = jugador === jugadores[0]
            ? pelota.x - radio <= jugador.x + paletaAncho && pelota.vx < 0
            : pelota.x + radio >= jugador.x && pelota.vx > 0;
          if (toca && cruza) {
            const centroRelativo = (pelota.y - (jugador.y + paletaAlto / 2)) / (paletaAlto / 2);
            pelota.vx = (jugador === jugadores[0] ? 1 : -1) * Math.min(620, Math.abs(pelota.vx) * 1.06);
            pelota.vy = centroRelativo * 360;
            pelota.x = jugador === jugadores[0] ? jugador.x + paletaAncho + radio : jugador.x - radio;
          }
        }
        if (pelota.x < 0) punto(jugadores[1]);
        else if (pelota.x > ancho) punto(jugadores[0]);
      }
      function bucle(tiempo = 0) {
        const delta = Math.min((tiempo - ultimo) / 1000, .04);
        ultimo = tiempo;
        if (jugando) actualizar(delta);
        dibujar();
        requestAnimationFrame(bucle);
      }
      function iniciar() {
        if (terminado) return;
        if (pelota.vx === 0) sacar(Math.random() < .5 ? -1 : 1);
        jugando = true; estado.textContent = 'Partido en juego.';
      }
      function reiniciar() {
        jugadores.forEach((jugador) => { jugador.puntos = 0; jugador.y = (alto - paletaAlto) / 2; });
        pelota = { x: ancho / 2, y: alto / 2, vx: 0, vy: 0 };
        jugando = false; terminado = false; espera = 0;
        actualizarMarcador(); dibujar();
        estado.textContent = 'Pulsa Iniciar para comenzar el partido.';
      }
      document.getElementById('iniciar').addEventListener('click', iniciar);
      document.getElementById('pausar').addEventListener('click', () => {
        jugando = false;
        if (!terminado) estado.textContent = 'Partido en pausa.';
      });
      document.getElementById('reiniciar').addEventListener('click', reiniciar);
      document.addEventListener('keydown', (evento) => {
        const tecla = evento.key.length === 1 ? evento.key.toLowerCase() : evento.key === 'ArrowUp' ? 'up' : evento.key === 'ArrowDown' ? 'down' : '';
        if (tecla === 'p') {
          if (jugando) document.getElementById('pausar').click(); else iniciar();
          return;
        }
        if (['w', 's', 'up', 'down'].includes(tecla)) {
          evento.preventDefault(); teclas.add(tecla); iniciar();
        }
      });
      document.addEventListener('keyup', (evento) => {
        const tecla = evento.key.length === 1 ? evento.key.toLowerCase() : evento.key === 'ArrowUp' ? 'up' : evento.key === 'ArrowDown' ? 'down' : '';
        teclas.delete(tecla);
      });
      document.querySelectorAll('[data-control]').forEach((boton) => {
        const tecla = boton.dataset.control;
        boton.addEventListener('pointerdown', (evento) => { evento.preventDefault(); controles.add(tecla); iniciar(); });
        const soltar = () => controles.delete(tecla);
        boton.addEventListener('pointerup', soltar);
        boton.addEventListener('pointercancel', soltar);
        boton.addEventListener('lostpointercapture', soltar);
      });
      window.addEventListener('blur', () => { teclas.clear(); controles.clear(); });
      reiniciar();
      requestAnimationFrame(bucle);
    })();
  </script>
</body>
</html>
